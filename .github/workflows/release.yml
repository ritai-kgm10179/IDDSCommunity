name: Release installer

on:
  push:
    tags:
      # GitHub tag filters use glob syntax; the validation job enforces exact vX.Y.Z.
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  validate:
    name: Validate signed tag and test
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve release ref
        id: version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:REQUESTED_TAG } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') { throw "Release tag must match vX.Y.Z: $tag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Checkout signed tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Verify annotated tag signature
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $reference = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($reference.object.type -ne 'tag') { throw 'Release tags must be signed annotated tags, not lightweight tags.' }
          $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($reference.object.sha)" | ConvertFrom-Json
          if (-not $tagObject.verification.verified) { throw "Tag signature is not verified: $($tagObject.verification.reason)" }
          if (-not $tagObject.verification.signature.StartsWith('-----BEGIN PGP SIGNATURE-----', [StringComparison]::Ordinal)) { throw 'Release tags must use an OpenPGP/GPG signature.' }
          if ($tagObject.object.sha -ne (git rev-parse HEAD)) { throw 'The signed tag does not point to the checked-out commit.' }

      - name: Validate project version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          [xml] $project = Get-Content IDDSCommunity.IntrusionDetection.Setup/IDDSCommunity.IntrusionDetection.Setup.csproj
          $projectVersion = [string] $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($projectVersion -ne $env:RELEASE_VERSION) { throw "Tag version $env:RELEASE_VERSION does not match setup version $projectVersion." }

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: |
            Directory.Build.props
            IDDSCommunity.slnx

      - name: Restore, build, and test
        shell: pwsh
        run: |
          dotnet restore IDDSCommunity.slnx --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build IDDSCommunity.slnx --configuration Release --no-restore --disable-build-servers -m:1 -p:UseSharedCompilation=false --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test IDDSCommunity.slnx --configuration Release --no-build --disable-build-servers -m:1 --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  package:
    name: Package ${{ matrix.rid }}
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - name: Checkout signed tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: |
            Directory.Build.props
            IDDSCommunity.slnx

      - name: Build self-contained installer package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_RID: ${{ matrix.rid }}
        run: |
          ./build-setup.ps1 -RuntimeIdentifier $env:RELEASE_RID -Configuration Release -Version $env:RELEASE_VERSION
          $package = "artifacts/setup/idds-community-$env:RELEASE_VERSION-$env:RELEASE_RID"
          $archive = "artifacts/setup/idds-community-$env:RELEASE_VERSION-$env:RELEASE_RID.zip"
          if (-not (Test-Path "$package/Setup.exe")) { throw 'Setup executable is missing.' }
          if (-not (Test-Path "$package/LICENSE")) { throw 'LICENSE is missing from package root.' }
          # Service and Admin executables are embedded inside payload.zip which is compiled into Setup.exe;
          # they are not present as loose files in the package root after build-setup.ps1 cleans up.

          $sbomToolDirectory = Join-Path $env:RUNNER_TEMP 'sbom-tool'
          dotnet tool install --tool-path $sbomToolDirectory Microsoft.Sbom.DotNetTool --version 4.1.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sbomTool = Join-Path $sbomToolDirectory 'sbom-tool.exe'
          $namespace = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$env:RELEASE_VERSION/$env:RELEASE_RID"
          $sbomStaging = Join-Path $env:RUNNER_TEMP "sbom-$env:RELEASE_RID"
          $sboms = @(
            @{ Info = 'SPDX:3.0'; Directory = 'spdx_3.0'; File = "artifacts/setup/idds-community-$env:RELEASE_VERSION-$env:RELEASE_RID.spdx-3.0.json" },
            @{ Info = 'SPDX:2.2'; Directory = 'spdx_2.2'; File = "artifacts/setup/idds-community-$env:RELEASE_VERSION-$env:RELEASE_RID.spdx-2.2.json" }
          )
          foreach ($definition in $sboms) {
            $staging = Join-Path $sbomStaging $definition.Directory
            New-Item -ItemType Directory -Path $staging -Force | Out-Null
            & $sbomTool generate -b $package -bc $env:GITHUB_WORKSPACE -m $staging -pn "IDDS Community $env:RELEASE_RID" -pv $env:RELEASE_VERSION -ps 'Organization: IDDS Community' -nsb "$namespace/$($definition.Directory)" -mi $definition.Info
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $generatedSbom = Join-Path $staging "_manifest/$($definition.Directory)/manifest.spdx.json"
            if (-not (Test-Path $generatedSbom)) { throw "$($definition.Info) SBOM was not generated." }
          }
          foreach ($definition in $sboms) {
            $generatedSbom = Join-Path (Join-Path $sbomStaging $definition.Directory) "_manifest/$($definition.Directory)/manifest.spdx.json"
            $packageSbomDirectory = Join-Path $package "_manifest/$($definition.Directory)"
            New-Item -ItemType Directory -Path $packageSbomDirectory -Force | Out-Null
            Copy-Item -LiteralPath $generatedSbom -Destination (Join-Path $packageSbomDirectory 'manifest.spdx.json')
            Copy-Item -LiteralPath $generatedSbom -Destination $definition.File
          }
          $spdx30 = Get-Content -LiteralPath $sboms[0].File -Raw | ConvertFrom-Json
          $spdx22 = Get-Content -LiteralPath $sboms[1].File -Raw | ConvertFrom-Json
          if ($spdx30.'@context' -ne 'https://spdx.org/rdf/3.0.1/spdx-context.json') { throw 'Unexpected SPDX 3.0 context.' }
          if ($spdx22.spdxVersion -ne 'SPDX-2.2') { throw 'Unexpected SPDX 2.2 version.' }

          Compress-Archive -Path "$package/*" -DestinationPath $archive -CompressionLevel Optimal
          foreach ($subject in @($archive, $sboms[0].File, $sboms[1].File)) {
            $hash = (Get-FileHash -LiteralPath $subject -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$(Split-Path -Leaf $subject)" | Set-Content -LiteralPath "$subject.sha256" -Encoding utf8NoBOM
          }

      - name: Upload installer package
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.rid }}
          path: |
            artifacts/setup/*.zip
            artifacts/setup/*.spdx-*.json
            artifacts/setup/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [validate, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download installer packages
        uses: actions/download-artifact@v7
        with:
          pattern: installer-*
          path: release
          merge-multiple: true

      - name: Attest installer and SBOM provenance
        uses: actions/attest@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          subject-path: |
            release/*.zip
            release/*.spdx-*.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "IDDS Community $RELEASE_TAG"
