name: Release installer

on:
  push:
    tags:
      # GitHub tag filters use glob syntax; the validation job enforces exact vX.Y.Z.
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  validate:
    name: Validate signed tag and test
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Resolve release ref
        id: version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:REQUESTED_TAG } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') { throw "Release tag must match vX.Y.Z: $tag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Checkout signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Verify annotated tag signature
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $reference = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($reference.object.type -ne 'tag') { throw 'Release tags must be signed annotated tags, not lightweight tags.' }
          $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($reference.object.sha)" | ConvertFrom-Json
          if (-not $tagObject.verification.verified) { throw "Tag signature is not verified: $($tagObject.verification.reason)" }
          if (-not $tagObject.verification.signature.StartsWith('-----BEGIN PGP SIGNATURE-----', [StringComparison]::Ordinal)) { throw 'Release tags must use an OpenPGP/GPG signature.' }
          $headSha = git rev-parse HEAD
          if ($tagObject.object.sha -ne $headSha) { throw 'The signed tag does not point to the checked-out commit.' }
          # 傳出已完成簽章驗證的確切 commit SHA；後續 job 一律以此 SHA checkout，
          # 避免簽章驗證後、封裝與發布前的時間差內 tag 被移動而繞過驗證（TOCTOU）。
          "sha=$headSha" >> $env:GITHUB_OUTPUT

      - name: Verify asset provenance
        shell: pwsh
        run: ./scripts/test-asset-provenance.ps1

      - name: Validate project version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          [xml] $project = Get-Content src/IDDSCommunity.IntrusionDetection.Setup/IDDSCommunity.IntrusionDetection.Setup.csproj
          $projectVersion = [string] $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($projectVersion -ne $env:RELEASE_VERSION) { throw "Tag version $env:RELEASE_VERSION does not match setup version $projectVersion." }

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: |
            Directory.Build.props
            Directory.Packages.props
            IDDSCommunity.slnx

      - name: Restore, build, and test
        shell: pwsh
        run: |
          dotnet restore IDDSCommunity.slnx -m:1 --disable-parallel --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build IDDSCommunity.slnx --configuration Release --no-restore --disable-build-servers -m:1 -p:UseSharedCompilation=false --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test IDDSCommunity.slnx --configuration Release --no-build --no-restore --disable-build-servers -m:1 --filter "TestCategory!=Stability" --logger "trx;LogFilePrefix=release" --results-directory TestResults --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/IDDSCommunity.IntrusionDetection.Service.Test/IDDSCommunity.IntrusionDetection.Service.Test.csproj --configuration Release --no-build --no-restore --disable-build-servers -m:1 --filter "TestCategory=Stability" --logger "trx;LogFileName=release-stability.trx" --results-directory TestResults --verbosity normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload validation test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-validation-test-results
          path: TestResults/**/*.trx
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package ${{ matrix.rid }}
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: |
            Directory.Build.props
            Directory.Packages.props
            IDDSCommunity.slnx
            **/*.csproj

      - name: Build self-contained installer package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_RID: ${{ matrix.rid }}
        run: |
          ./build-setup.ps1 -RuntimeIdentifier $env:RELEASE_RID -Configuration Release -Version $env:RELEASE_VERSION
          $package = "artifacts/setup/idds-community-$env:RELEASE_VERSION-$env:RELEASE_RID"
          $archive = "artifacts/setup/idds-community-$env:RELEASE_VERSION-$env:RELEASE_RID.zip"
          $spdx30File = "artifacts/setup/idds-community-$env:RELEASE_VERSION-$env:RELEASE_RID.spdx-3.0.json"
          $spdx22File = "artifacts/setup/idds-community-$env:RELEASE_VERSION-$env:RELEASE_RID.spdx-2.2.json"
          if (-not (Test-Path "$package/Setup.exe")) { throw 'Setup executable is missing.' }
          if (-not (Test-Path "$package/LICENSE")) { throw 'LICENSE is missing from package root.' }
          # Service and Admin executables are embedded inside payload.zip which is compiled into Setup.exe;
          # they are not present as loose files in the package root after build-setup.ps1 cleans up.

          foreach ($requiredFile in @(
            $archive,
            $spdx30File,
            $spdx22File,
            "$archive.sha256",
            "$spdx30File.sha256",
            "$spdx22File.sha256",
            "$package/_manifest/spdx_3.0/manifest.spdx.json",
            "$package/_manifest/spdx_2.2/manifest.spdx.json"
          )) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Required release artifact is missing: $requiredFile"
            }
          }

          $spdx30 = Get-Content -LiteralPath $spdx30File -Raw | ConvertFrom-Json
          $spdx22 = Get-Content -LiteralPath $spdx22File -Raw | ConvertFrom-Json
          if ($spdx30.'@context' -ne 'https://spdx.org/rdf/3.0.1/spdx-context.json') { throw 'Unexpected SPDX 3.0 context.' }
          if ($spdx22.spdxVersion -ne 'SPDX-2.2') { throw 'Unexpected SPDX 2.2 version.' }

          foreach ($subject in @($archive, $spdx30File, $spdx22File)) {
            $actualHash = (Get-FileHash -LiteralPath $subject -Algorithm SHA256).Hash.ToLowerInvariant()
            $expectedLine = "$actualHash *$(Split-Path -Leaf $subject)"
            $recordedLine = (Get-Content -LiteralPath "$subject.sha256" -Raw).Trim()
            if ($recordedLine -cne $expectedLine) {
              throw "SHA-256 verification failed for release artifact: $subject"
            }
          }

      - name: Upload installer package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-${{ matrix.rid }}
          path: |
            artifacts/setup/*.zip
            artifacts/setup/*.spdx-*.json
            artifacts/setup/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [validate, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0

      - name: Download installer packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: installer-*
          path: release
          merge-multiple: true

      - name: Attest installer and SBOM provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          subject-path: |
            release/*.zip
            release/*.spdx-*.json
            release/*.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          git tag -l --format="%(contents:subject)%0a%0a%(contents:body)" "$RELEASE_TAG" > release_notes.txt
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "IDDS Community $RELEASE_TAG" --notes-file release_notes.txt
