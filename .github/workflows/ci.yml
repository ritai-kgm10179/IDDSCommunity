name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify asset provenance
        shell: pwsh
        run: ./scripts/test-asset-provenance.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: |
            Directory.Build.props
            Directory.Packages.props
            IDDSCommunity.slnx
            **/*.csproj

      - name: Restore
        run: dotnet restore IDDSCommunity.slnx -m:1 --disable-parallel --nologo

      - name: Build
        run: dotnet build IDDSCommunity.slnx --configuration Release --no-restore --disable-build-servers -m:1 -p:UseSharedCompilation=false --nologo

      - name: Test
        run: dotnet test IDDSCommunity.slnx --configuration Release --no-build --disable-build-servers -m:1 --filter "TestCategory!=Stability" --logger "trx;LogFilePrefix=ci" --results-directory TestResults --verbosity minimal

      - name: Stability tests
        run: dotnet test tests/IDDSCommunity.IntrusionDetection.Service.Test/IDDSCommunity.IntrusionDetection.Service.Test.csproj --configuration Release --no-build --disable-build-servers -m:1 --filter "TestCategory=Stability" --logger "trx;LogFileName=stability.trx" --results-directory TestResults --verbosity normal

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: error
          retention-days: 14

  privileged-windows:
    name: Privileged Windows integration tests
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: |
            Directory.Build.props
            Directory.Packages.props
            IDDSCommunity.slnx
            **/*.csproj

      - name: Restore
        run: dotnet restore IDDSCommunity.slnx -m:1 --disable-parallel --nologo

      - name: Build integration targets
        run: dotnet build tests/IDDSCommunity.IntrusionDetection.Service.Test/IDDSCommunity.IntrusionDetection.Service.Test.csproj --configuration Release --runtime win-x64 --no-restore --disable-build-servers -m:1 -p:UseSharedCompilation=false --nologo

      - name: Run privileged integration tests
        shell: pwsh
        run: ./scripts/run-ci-windows-integration-tests.ps1

      - name: Upload privileged test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: privileged-test-results
          path: tests/IDDSCommunity.IntrusionDetection.Service.Test/TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
